<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="/src/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS агрегатор</title>
</head>
<body class="d-flex flex-column min-vh-100">
  <main class="flex-grow-1">
    <section class="container-fluid bg-dark p-5">
      <div class="row">
        <div class="col-md-10 col-lg-8 mx-auto text-white">
          <h1 class="display-3 mb-0" data-i18n="app.title">RSS агрегатор</h1>
          <p class="lead" data-i18n="app.lead">Начните читать RSS сегодня! Это легко, это красиво.</p>
          
          <form class="rss-form text-body" novalidate>
            <div class="row">
              <div class="col">
                <div class="form-floating">
                  <input 
                    id="url-input" 
                    autofocus 
                    type="url" 
                    required 
                    name="url" 
                    aria-label="url" 
                    class="form-control w-100" 
                    placeholder="Ссылка RSS"
                    autocomplete="off"
                  />
                  <label for="url-input" data-i18n="form.urlLabel">Ссылка RSS</label>
                </div>
              </div>
              <div class="col-auto">
                <button type="submit" aria-label="add" class="h-100 btn btn-lg btn-primary px-sm-5" data-i18n="form.button">Добавить</button>
              </div>
            </div>
          </form>
          
          <p class="mt-2 mb-0 text-secondary" data-i18n="form.example">Пример: https://lorem-rss.hexlet.app/feed</p>
          <p class="feedback m-0 position-absolute small"></p>
        </div>
      </div>
    </section>

    <section class="container-fluid container-xxl p-5">
      <div class="row g-5">
        <div class="col-md-10 col-lg-8 order-1 mx-auto">
          <div class="posts-container posts">
            <ul class="list-group">
            </ul>
          </div>
        </div>
        <div class="col-md-10 col-lg-4 mx-auto order-0 order-lg-1">
          <div class="feeds-container feeds">
            <ul class="list-group mb-4">
            </ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p></p>
      </div>
      <div class="modal-footer">
        <a href="#" target="_blank" class="btn btn-primary" data-i18n="posts.readFull">Читать полностью</a>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="posts.close">
          Закрыть
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
